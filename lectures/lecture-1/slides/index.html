<!DOCTYPE html><html lang="en" class="antialiased"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lecture-1 – Slides</title><meta name="description" content><script>
  (function () {
    try {
      localStorage.removeItem('theme');
    } catch {}

    try {
      const mql = window.matchMedia('(prefers-color-scheme: dark)');
      const apply = (dark) => {
        document.documentElement.classList.toggle('dark', !!dark);
        if (typeof syncWidgetDarkMode === 'function') syncWidgetDarkMode(!!dark);
      };

      apply(mql.matches);
      mql.addEventListener('change', (e) => apply(e.matches));
      document.addEventListener('astro:after-swap', () => apply(mql.matches));
    } catch {}
  })();
</script><link rel="stylesheet" href="/basics_exercise_physiology/_astro/index.CupQ9Wmy.css">
