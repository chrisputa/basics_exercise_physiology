<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz - Basics in Exercise Physiology</title>
<style>
  :root{
    --rot:#A5132B;
    --rot-d:#7d0e20;
    --ink:#1a1a1a;
    --grey-1:#f5f5f4;
    --grey-2:#e7e5e4;
    --grey-3:#c8c5c2;
    --grey-4:#8a8784;
    --grey-5:#56524f;
    --ok:#2f6e3b;
    --ok-bg:#eaf3eb;
    --no:#A5132B;
    --no-bg:#fbecee;
    --paper:#ffffff;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:transparent;
    line-height:1.55;
  }
  .wrap{max-width:none;margin:0;padding:0;}
  header.top{
    border-bottom:3px solid var(--rot);
    padding-bottom:14px;margin-bottom:24px;
  }
  header.top .kicker{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--rot);font-weight:700;margin:0 0 4px;
  }
  header.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;}
  header.top .sub{color:var(--grey-5);font-size:14px;margin-top:4px;}

  .card{
    background:var(--paper);
    border:1px solid var(--grey-2);
    border-radius:var(--radius);
    padding:26px;
  }

  /* Start screen */
  .lead{font-size:15px;color:var(--grey-5);margin:0 0 20px;}
  .opts-grid{display:grid;gap:14px;margin:18px 0 24px;}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  select,input[type=number]{
    width:100%;padding:9px 10px;border:1px solid var(--grey-3);
    border-radius:var(--radius);font-size:15px;background:#fff;color:var(--ink);
  }
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row>.field{flex:1;min-width:160px;}
  .check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer;}
  .check input{width:17px;height:17px;accent-color:var(--rot);}

  .btn{
    display:inline-block;border:none;cursor:pointer;
    background:var(--rot);color:#fff;font-size:15px;font-weight:600;
    padding:12px 22px;border-radius:var(--radius);
    transition:background .15s;
  }
  .btn:hover{background:var(--rot-d);}
  .btn:focus-visible{outline:3px solid var(--rot);outline-offset:2px;}
  .btn.ghost{background:#fff;color:var(--rot);border:1px solid var(--rot);}
  .btn.ghost:hover{background:var(--no-bg);}
  .btn.grey{background:var(--grey-2);color:var(--ink);}
  .btn.grey:hover{background:var(--grey-3);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Quiz screen */
  .meta-bar{
    display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--grey-5);margin-bottom:10px;
  }
  .tags{display:flex;gap:6px;}
  .tag{
    font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;
    padding:2px 8px;border-radius:99px;background:var(--grey-2);color:var(--grey-5);
  }
  .tag.lvl{color:#fff;}
  .tag.lvl1{background:var(--grey-4);}
  .tag.lvl2{background:var(--grey-5);}
  .tag.lvl3{background:var(--rot);}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);}
  .progress{height:5px;background:var(--grey-2);border-radius:99px;overflow:hidden;margin-bottom:18px;}
  .progress>span{display:block;height:100%;background:var(--rot);width:0;transition:width .25s;}
  .qtext{font-size:18px;font-weight:600;margin:0 0 18px;line-height:1.4;}
  .answers{display:grid;gap:10px;}
  .ans{
    text-align:left;width:100%;cursor:pointer;
    background:#fff;border:1px solid var(--grey-3);border-radius:var(--radius);
    padding:13px 15px;font-size:15px;color:var(--ink);
    display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,background .12s;
  }
  .ans:hover:not(:disabled){border-color:var(--rot);}
  .ans:focus-visible{outline:3px solid var(--rot);outline-offset:2px;}
  .ans .letter{
    flex:0 0 auto;font-weight:700;color:var(--grey-4);
    width:22px;height:22px;border:1px solid var(--grey-3);border-radius:99px;
    display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px;
  }
  .ans.correct{background:var(--ok-bg);border-color:var(--ok);}
  .ans.correct .letter{background:var(--ok);color:#fff;border-color:var(--ok);}
  .ans.wrong{background:var(--no-bg);border-color:var(--no);}
  .ans.wrong .letter{background:var(--no);color:#fff;border-color:var(--no);}
  .ans:disabled{cursor:default;}
  .feedback{margin-top:16px;font-size:14px;min-height:24px;}
  .feedback .fb-ok{color:var(--ok);font-weight:600;}
  .feedback .fb-no{color:var(--no);font-weight:600;}
  .navbtns{margin-top:22px;display:flex;justify-content:flex-end;}

  /* Results */
  .scorebox{
    display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 24px;
  }
  .stat{
    flex:1;min-width:130px;border:1px solid var(--grey-2);border-radius:var(--radius);
    padding:16px;text-align:center;background:#fff;
  }
  .stat .num{font-size:30px;font-weight:700;line-height:1;}
  .stat .num.accent{color:var(--rot);}
  .stat .lbl{font-size:12px;color:var(--grey-5);margin-top:6px;text-transform:uppercase;letter-spacing:.06em;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--grey-2);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey-5);font-weight:700;}
  td.c{text-align:center;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:99px;}
  .dot.ok{background:var(--ok);}
  .dot.no{background:var(--no);}
  .result-actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;}
  .hidden{display:none;}
  .qcell{max-width:340px;}
  footer.foot{margin-top:32px;font-size:12px;color:var(--grey-4);text-align:center;}
  @media (max-width:560px){
    .card{padding:18px;}
    .qcell{max-width:none;}
    table{font-size:12px;}
    th,td{padding:6px 5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- START -->
  <section id="start" class="card">
    <p class="lead">Wähle Umfang und Stufen, dann starte das Quiz. Pro Frage werden Antwortzeit und Ergebnis erfasst. Die Antwortoptionen werden bei jedem Durchlauf neu gemischt.</p>
    <div class="opts-grid">
      <div class="row">
        <div class="field">
          <label for="levelSel">Schwierigkeit</label>
          <select id="levelSel">
            <option value="0">Alle Stufen</option>
            <option value="1">Nur Stufe 1 – leicht</option>
            <option value="2">Nur Stufe 2 – mittel</option>
            <option value="3">Nur Stufe 3 – schwer</option>
          </select>
        </div>
        <div class="field">
          <label for="countSel">Anzahl Fragen</label>
          <input type="number" id="countSel" min="1" value="15">
        </div>
      </div>
      <label class="check"><input type="checkbox" id="shuffleQ" checked> Fragen in zufälliger Reihenfolge</label>
      <label class="check"><input type="checkbox" id="instantFb" checked> Sofortiges Feedback nach jeder Antwort</label>
    </div>
    <button class="btn" id="startBtn">Quiz starten</button>
    <p class="sub" id="poolInfo" style="margin-top:14px;"></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="card hidden">
    <div class="meta-bar">
      <div class="tags" id="qtags"></div>
      <div class="timer" id="qtimer">0,0 s</div>
    </div>
    <div class="progress"><span id="progBar"></span></div>
    <p class="qtext" id="qtext"></p>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div class="navbtns">
      <button class="btn" id="nextBtn" disabled>Weiter</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="card hidden">
    <p class="kicker" style="color:var(--rot);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;">Ergebnis</p>
    <h2 style="margin:0 0 18px;font-size:22px;" id="scoreHead">Auswertung</h2>
    <div class="scorebox">
      <div class="stat"><div class="num accent" id="sCorrect">0</div><div class="lbl">richtig</div></div>
      <div class="stat"><div class="num" id="sPct">0&nbsp;%</div><div class="lbl">Trefferquote</div></div>
      <div class="stat"><div class="num" id="sTotal">0&nbsp;s</div><div class="lbl">Gesamtzeit</div></div>
      <div class="stat"><div class="num" id="sAvg">0&nbsp;s</div><div class="lbl">Ø pro Frage</div></div>
    </div>
    <table id="resultTable">
      <thead>
        <tr><th>#</th><th>Stufe</th><th class="qcell">Frage</th><th class="c">✓/✗</th><th class="num">Zeit</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="result-actions">
      <button class="btn" id="retryBtn">Neues Quiz</button>
      <button class="btn ghost" id="csvBtn">Ergebnis als CSV</button>
    </div>
  </section>
</div>

<script>
/* ============================================================
   FRAGEN-DATENBANK
   - Fragen und Optionen sind gegenüber der Klausur umformuliert.
   - correct = richtige Aussage, wrong = Distraktoren.
   - Positionen werden zur Laufzeit gemischt (s. buildOptions).
   ============================================================ */
const BANK = [
  // ============================================================
  //  STUFE 1 – LEICHT (30 Fragen)
  // ============================================================
  {n:1, level:1,
   q:"Wie unterscheiden sich die Begriffe 'körperliche Aktivität' und 'Training'?",
   correct:"Körperliche Aktivität ist jede muskelerzeugte Bewegung mit Energieverbrauch; Training ist geplant, strukturiert und zielgerichtet",
   wrong:["Beide Begriffe sind vollständig synonym","Training umfasst jede ziellose Alltagsbewegung","Körperliche Aktivität setzt stets einen Wettkampf voraus","Training findet definitionsgemäß ohne Energieverbrauch statt"]},
  {n:2, level:1,
   q:"Welche Aussage zu den Komponenten des Energieumsatzes ist zutreffend?",
   correct:"Der Grundumsatz (BMR) deckt die essenziellen physiologischen Funktionen in Ruhe",
   wrong:["Der thermische Effekt der Nahrung (TEF) liefert die Energie für sportliche Muskelarbeit","NEAT bezeichnet den Energieumsatz während des Schlafs","Die Aktivitätsenergie (AEE) ist von Intensität und Dauer unabhängig","Der Grundumsatz schwankt stündlich um mehr als 50 %"]},
  {n:3, level:1,
   q:"Was beschreibt der Begriff Homöostase am treffendsten?",
   correct:"Das dynamische Gleichgewicht des inneren Milieus, das über negative Rückkopplung stabilisiert wird",
   wrong:["Ein starres Gleichgewicht ganz ohne Regulation","Eine ausschließlich durch positive Rückkopplung verstärkte Störung","Allein die langfristige Trainingsanpassung über Monate","Ein Zustand, der von körperlicher Aktivität unbeeinflusst bleibt"]},
  {n:4, level:1,
   q:"Wodurch ist eine hormetische Dosis-Wirkungs-Beziehung gekennzeichnet?",
   correct:"Niedrige bis moderate Reize wirken positiv, sehr hohe Dosen erzeugen gegenteilige Effekte (biphasisch)",
   wrong:["Der Nutzen steigt streng linear mit zunehmender Belastung","Jeder Reiz führt zum vollständigen Verlust der Anpassungsfähigkeit","Gemeint ist nur die kurzfristige Rückkehr zu den Ruhewerten","Hohe und niedrige Dosen wirken stets identisch"]},
  {n:5, level:1,
   q:"Welcher Schlafabschnitt ist am stärksten mit körperlicher Erholung verknüpft?",
   correct:"Der Tiefschlaf (Slow-Wave-Sleep, Stadium 3)",
   wrong:["Der REM-Schlaf, der 70–80 % der Schlafzeit ausmacht","Das Einschlafstadium 1","Ein einzelner Schlafzyklus von rund 20 Minuten","Die Wachphasen zwischen den Zyklen"]},
  {n:6, level:1,
   q:"Welche akute Herz-Kreislauf-Reaktion ist bei moderater Belastung zu erwarten?",
   correct:"Herzfrequenz und Schlagvolumen steigen, um den O₂-Transport zur Muskulatur zu erhöhen",
   wrong:["Die Herzfrequenz sinkt zur Energieeinsparung","Der Blutfluss zur arbeitenden Muskulatur nimmt ab","Das Schlagvolumen bleibt strikt unverändert","Der Blutdruck fällt unter den Ruhewert"]},
  {n:7, level:1,
   q:"Wie unterscheiden sich angeborene und adaptive Immunität?",
   correct:"Die angeborene Immunität reagiert sofort und unspezifisch, die adaptive spezifisch und mit Gedächtnisbildung",
   wrong:["Die adaptive Immunität reagiert sofort und unspezifisch","T-Lymphozyten zählen zur angeborenen Immunität","Die angeborene Immunität benötigt eine vorherige Sensibilisierung","Beide Systeme bilden gleichermaßen ein immunologisches Gedächtnis"]},
  {n:8, level:1,
   q:"Welche Aussage zur Entzündung trifft zu?",
   correct:"Akute Entzündung ist eine schützende, selbstlimitierende Reaktion; chronische Entzündung schadet der Gesundheit",
   wrong:["Chronische Entzündung ist immer erwünscht und schützend","Akute Entzündung dauert typischerweise Wochen bis Monate","Chronische Entzündung spielt bei Herz-Kreislauf-Erkrankungen keine Rolle","Akute und chronische Entzündung sind funktionell identisch"]},
  {n:9, level:1,
   q:"Welche Aussage zu Interleukin-6 (IL-6) ist korrekt?",
   correct:"In Ruhe eher proinflammatorisch, als belastungsinduziertes Myokin jedoch antiinflammatorisch",
   wrong:["IL-6 wird ausschließlich von Leberzellen gebildet","IL-6 hat keine Rolle im Energiestoffwechsel","IL-6 unterdrückt grundsätzlich jede Trainingsanpassung","IL-6 wirkt unter allen Bedingungen rein proinflammatorisch"]},
  {n:10, level:1,
   q:"Welche Aussage zu ATP als Energieträger ist richtig?",
   correct:"ATP ist die Energiewährung der Muskelarbeit und kann sowohl aerob als auch anaerob bereitgestellt werden",
   wrong:["ATP entsteht ausschließlich aerob","Energie im physiologischen Sinn ist von ATP unabhängig","Der Muskeltonus in Ruhe benötigt kein ATP","ATP kann ausschließlich anaerob gebildet werden"]},
  {n:11, level:1,
   q:"Welcher Makronährstoff besitzt den höchsten physiologischen Energiewert pro Gramm?",
   correct:"Fett mit etwa 9,3 kcal/g",
   wrong:["Kohlenhydrate mit ~4,1 kcal/g","Protein mit ~4,1 kcal/g","Glucose mit ~3,8 kcal/g","Alle drei liefern exakt 4 kcal/g"]},
  {n:12, level:1,
   q:"Welche Energiequelle deckt eine maximale Belastung von unter 2 Sekunden?",
   correct:"Das unmittelbar vorhandene ATP samt Kreatinphosphat",
   wrong:["Die aerobe Glykolyse","Die β-Oxidation der Fettsäuren","Der Alanin-Glucose-Zyklus","Die oxidative Phosphorylierung in den Mitochondrien"]},
  {n:13, level:1,
   q:"Wie ist die anaerobe Schwelle funktionell zu verstehen?",
   correct:"Sie entspricht dem maximalen Laktat-Steady-State (MLSS)",
   wrong:["Sie ist ein abrupter Umschaltpunkt von rein aerob zu rein anaerob","Oberhalb des MLSS bleibt das Laktat konstant","Das MLSS liegt bei allen Menschen bei exakt 4 mmol/L","Sie markiert den Punkt der maximalen Fettoxidation"]},
  {n:14, level:1,
   q:"Wie ist der feste 4-mmol/L-Schwellenwert (OBLA) einzuordnen?",
   correct:"Als Populationsmittelwert, nicht als biologische Konstante",
   wrong:["Die MLSS-Laktatkonzentration ist bei allen Personen identisch","Ausdauertrainierte haben in der Regel ein höheres MLSS-Laktat","Der Wert wurde wissenschaftlich nie hinterfragt","Er gilt für jeden Menschen exakt gleich"]},
  {n:15, level:1,
   q:"Warum wird die Herzfrequenz in der Trainingspraxis als Steuergröße bevorzugt?",
   correct:"Sie ist einfach zu messen und im Feld praktikabler als wiederholte Laktatmessungen",
   wrong:["Sie reagiert empfindlicher als Laktat auf Betablocker","Sie ist von der Belastungsintensität völlig unabhängig","Sie liefert nur bei Maximalbelastung verwertbare Werte","Sie ist bei jedem Menschen exakt gleich"]},
  {n:16, level:1,
   q:"Welche Trainingszone liegt bei etwa 90–100 % der IAS-Geschwindigkeit?",
   correct:"Intensive Ausdauer (GA II / Tempodauerlauf)",
   wrong:["Regenerationstraining","Extensive Ausdauer (GA I)","Reines Maximalkrafttraining","Vollständige Ruhe"]},
  {n:17, level:1,
   q:"Welche vier Variablen verwendet das Nicht-Belastungsmodell nach Nes et al. (2011)?",
   correct:"Alter, BMI, Ruheherzfrequenz und körperlicher Aktivitätsindex (PA-Index)",
   wrong:["Größe, Gewicht, Laktat und VO₂max","Geschlecht, Schlafdauer, Kalorienzufuhr und Schrittzahl","Alter, Blutdruck, HbA1c und Tanner-Stadium","HRV, VO₂max, Laktat und Körpergröße"]},
  {n:18, level:1,
   q:"Wie geht die Ruheherzfrequenz in die VO₂max-Schätzung des Nes-Modells ein?",
   correct:"Eine hohe Ruheherzfrequenz ist mit einer niedrigeren geschätzten VO₂max assoziiert",
   wrong:["Sie ist ein positiver Prädiktor der VO₂max","Sie hat keinen Einfluss auf die Schätzung","Je höher die Ruheherzfrequenz, desto höher die Fitness","Sie wird im Modell quadratisch gewichtet"]},
  {n:19, level:1,
   q:"Welchem Sauerstoffverbrauch entspricht ein metabolisches Äquivalent (1 MET)?",
   correct:"Etwa 3,5 mL·kg⁻¹·min⁻¹",
   wrong:["Etwa 35 mL·kg⁻¹·min⁻¹","Etwa 7,0 mL·kg⁻¹·min⁻¹","Etwa 1,0 L·min⁻¹ unabhängig vom Körpergewicht","Etwa 0,35 mL·kg⁻¹·min⁻¹"]},
  {n:20, level:1,
   q:"Welche Variable hat im Männer-Modell von Nes den größten absoluten Regressionskoeffizienten?",
   correct:"Der BMI (−0,933)",
   wrong:["Der PA-Index (+0,257)","Das Alter (−0,327)","Die Ruheherzfrequenz (−0,167)","Die Körpergröße (+0,512)"]},
  {n:21, level:1,
   q:"Welches Energiesystem liefert die Energie für hochintensive Belastungen von 5–10 Sekunden?",
   correct:"Das ATP-PCr-System (Phosphagensystem)",
   wrong:["Das oxidative System (aerober Metabolismus)","Die β-Oxidation der Fettsäuren","Der Pentosephosphatweg","Der Citratzyklus"]},
  {n:22, level:1,
   q:"Wie hoch ist der Netto-ATP-Ertrag der anaeroben Glykolyse pro Glucosemolekül?",
   correct:"2–3 ATP",
   wrong:["ca. 30–32 ATP","über 100 ATP","0 ATP, da kein Sauerstoff vorhanden ist","ca. 460 ATP"]},
  {n:23, level:1,
   q:"Welches Produkt entsteht unter anaeroben Bedingungen aus Pyruvat in der Skelettmuskulatur?",
   correct:"Laktat, gebildet durch die Laktatdehydrogenase",
   wrong:["Acetyl-CoA","Ethanol und CO₂","Ribose-5-Phosphat","Oxalacetat"]},
  {n:24, level:1,
   q:"Welcher Muskelfasertyp ist durch hohe Mitochondriendichte, Ermüdungsresistenz und oxidativen Stoffwechsel geprägt?",
   correct:"Typ-I-Fasern (langsam zuckend, oxidativ)",
   wrong:["Typ-IIx-Fasern (schnell zuckend, glykolytisch)","Typ-IIa-Fasern als rein glykolytische Fasern","Alle Fasertypen gleichermaßen","Ausschließlich intrafusale Fasern"]},
  {n:25, level:1,
   q:"Welche Aussage zum Cori-Zyklus ist korrekt?",
   correct:"Muskel-Laktat wird in der Leber per Gluconeogenese zu Glucose umgewandelt und kehrt zum Muskel zurück",
   wrong:["Glucose wird im Muskel direkt in Fett umgewandelt","Er läuft ausschließlich unter aeroben Bedingungen ab","Laktat wird dabei irreversibel zu CO₂ oxidiert","Er findet nur im Gehirn statt"]},
  {n:26, level:1,
   q:"Wie werden 'Exercise Snacks' definiert?",
   correct:"Als isolierte, kurze, intensive Belastungen (≤ 1 min), die mehrmals täglich durchführbar sind",
   wrong:["Als kontinuierliche Belastung von mindestens 60 Minuten","Als niedrigintensive Spaziergänge ohne HF-Anstieg","Als rein passive Erholungsphasen","Als einmal wöchentliche Maximalbelastung"]},
  {n:27, level:1,
   q:"Welche Aussage zur GLUT4-Translokation bei Muskelarbeit ist richtig?",
   correct:"Muskelkontraktionen lösen eine insulinunabhängige Translokation von GLUT4 zur Zellmembran aus",
   wrong:["GLUT4 wird ausschließlich durch Insulin reguliert","Bei Belastung sinkt die GLUT4-Dichte an der Zelloberfläche","GLUT4-Translokation findet nur in Ruhe statt","GLUT4 transportiert vorrangig Fettsäuren"]},
  {n:28, level:1,
   q:"Welches Ergebnis lieferte die VILPA-Studie (UK Biobank) bei 3 × 1–2-min-Belastungen pro Tag?",
   correct:"Eine deutliche Reduktion der Gesamt-, Krebs- und kardiovaskulären Mortalität",
   wrong:["Keinerlei Zusammenhang mit der Mortalität","Eine Erhöhung des Mortalitätsrisikos","Einen Effekt nur bei Leistungssportlern","Eine Wirkung ausschließlich auf das Körpergewicht"]},
  {n:29, level:1,
   q:"Welche Aussage zu Myokinen ist zutreffend?",
   correct:"Muskelkontraktionen setzen antiinflammatorische Botenstoffe (Myokine, z. B. IL-6) frei",
   wrong:["Myokine wirken ausschließlich proinflammatorisch","Der Muskel ist kein endokrines Organ","Myokine werden nur in der Leber gebildet","Myokine entstehen ausschließlich in Ruhe"]},
  {n:30, level:1,
   q:"Was änderte sich mit den aktualisierten WHO-Bewegungsleitlinien?",
   correct:"Die frühere Mindestdauer von 10 Minuten pro Aktivitätseinheit wurde aufgehoben",
   wrong:["Es werden weiterhin mindestens 30 Minuten am Stück verlangt","Kurze Aktivitäten zählen laut WHO nicht","Es wird ausschließlich kontinuierliches Ausdauertraining empfohlen","Krafttraining wird ausdrücklich abgeraten"]},

  // ============================================================
  //  STUFE 2 – MITTEL (30 Fragen)
  // ============================================================
  {n:31, level:2,

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildOptions(item){
  // Optionen mischen, Index der richtigen Antwort merken
  const opts = shuffle([{t:item.correct,ok:true}, ...item.wrong.map(w=>({t:w,ok:false}))]);
  return opts;
}

// Pool-Info beim Laden / bei Filteränderung
function updatePoolInfo(){
  const lvl = parseInt($("levelSel").value,10);
  const pool = lvl===0 ? BANK : BANK.filter(q=>q.level===lvl);
  const max = pool.length;
  const inp = $("countSel");
  inp.max = max;
  if(parseInt(inp.value,10) > max) inp.value = max;
  $("poolInfo").textContent = `Verfügbar in der Auswahl: ${max} Fragen.`;
}
$("levelSel").addEventListener("change", updatePoolInfo);
updatePoolInfo();

/* ============================================================
   QUIZ-ABLAUF
   ============================================================ */
function startQuiz(){
  const lvl = parseInt($("levelSel").value,10);
  let pool = lvl===0 ? BANK.slice() : BANK.filter(q=>q.level===lvl);
  if($("shuffleQ").checked) pool = shuffle(pool);
  let count = parseInt($("countSel").value,10);
  if(isNaN(count) || count<1) count = 1;
  count = Math.min(count, pool.length);
  pool = pool.slice(0, count);

  session = {
    questions: pool.map(item => ({...item, options: buildOptions(item)})),
    idx: 0,
    instant: $("instantFb").checked,
    results: []   // {n, level, q, correct(bool), timeSec, picked, answer}
  };

  $("start").classList.add("hidden");
  $("results").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  renderQuestion();
}

function renderQuestion(){
  const s = session;
  const item = s.questions[s.idx];

  // Tags & Fortschritt
  const lvlNames = {1:"Leicht",2:"Mittel",3:"Schwer"};
  $("qtags").innerHTML =
    `<span class="tag lvl lvl${item.level}">Stufe ${item.level} · ${lvlNames[item.level]}</span>`+
    `<span class="tag">Frage ${s.idx+1}/${s.questions.length}</span>`;
  $("progBar").style.width = ((s.idx)/s.questions.length*100) + "%";

  $("qtext").textContent = item.q;
  $("feedback").innerHTML = "";
  $("nextBtn").disabled = true;
  $("nextBtn").textContent = (s.idx === s.questions.length-1) ? "Auswerten" : "Weiter";

  // Antworten
  const wrap = $("answers");
  wrap.innerHTML = "";
  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "ans";
    btn.type = "button";
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${opt.t}</span>`;
    btn.addEventListener("click", () => pick(i, btn));
    wrap.appendChild(btn);
  });

  // Timer starten
  qStartTime = performance.now();
  startTick();
}

function startTick(){
  stopTick();
  $("qtimer").textContent = "0,0 s";
  tickHandle = setInterval(() => {
    const el = (performance.now()-qStartTime)/1000;
    $("qtimer").textContent = fmt(el);
  }, 100);
}
function stopTick(){ if(tickHandle){clearInterval(tickHandle); tickHandle=null;} }

function pick(i, btn){
  const s = session;
  const item = s.questions[s.idx];
  const timeSec = (performance.now()-qStartTime)/1000;
  stopTick();
  $("qtimer").textContent = fmt(timeSec);

  const chosen = item.options[i];
  const correct = !!chosen.ok;

  // Auswahl protokollieren
  s.results.push({
    n:item.n, level:item.level, q:item.q,
    correct, timeSec,
    answer: chosen.t,
    correctAnswer: item.correct
  });

  // Buttons sperren + markieren
  const btns = $("answers").querySelectorAll(".ans");
  btns.forEach((b, j) => {
    b.disabled = true;
    if(s.instant){
      if(item.options[j].ok) b.classList.add("correct");
      if(j===i && !correct) b.classList.add("wrong");
    } else if(j===i){
      b.classList.add(correct ? "correct" : "wrong");
    }
  });

  // Feedback
  if(s.instant){
    $("feedback").innerHTML = correct
      ? `<span class="fb-ok">Richtig.</span> <span style="color:var(--grey-5)">(${fmt(timeSec)})</span>`
      : `<span class="fb-no">Leider falsch.</span> <span style="color:var(--grey-5)">Richtig wäre: ${item.correct}</span>`;
  } else {
    $("feedback").innerHTML = `<span style="color:var(--grey-5)">Antwort erfasst (${fmt(timeSec)}).</span>`;
  }

  $("nextBtn").disabled = false;
  $("nextBtn").focus();
}

function next(){
  const s = session;
  if(s.idx < s.questions.length-1){
    s.idx++;
    renderQuestion();
  } else {
    showResults();
  }
}

/* ============================================================
   ERGEBNIS
   ============================================================ */
function showResults(){
  stopTick();
  const s = session;
  $("quiz").classList.add("hidden");
  $("results").classList.remove("hidden");
  $("progBar").style.width = "100%";

  const total = s.results.length;
  const right = s.results.filter(r=>r.correct).length;
  const totalTime = s.results.reduce((a,r)=>a+r.timeSec,0);
  const pct = total ? Math.round(right/total*100) : 0;
  const avg = total ? totalTime/total : 0;

  $("scoreHead").textContent = `${right} von ${total} Fragen richtig`;
  $("sCorrect").textContent = right;
  $("sPct").innerHTML = pct + "&nbsp;%";
  $("sTotal").innerHTML = totalTime.toFixed(0) + "&nbsp;s";
  $("sAvg").innerHTML = avg.toFixed(1).replace(".",",") + "&nbsp;s";

  const lvlNames = {1:"1 · leicht",2:"2 · mittel",3:"3 · schwer"};
  const tb = $("resultTable").querySelector("tbody");
  tb.innerHTML = "";
  s.results.forEach((r, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${i+1}</td>`+
      `<td>${lvlNames[r.level]}</td>`+
      `<td class="qcell">${r.q}</td>`+
      `<td class="c"><span class="dot ${r.correct?'ok':'no'}" title="${r.correct?'richtig':'falsch'}"></span></td>`+
      `<td class="num">${fmt(r.timeSec)}</td>`;
    tb.appendChild(tr);
  });
}

function downloadCSV(){
  const s = session;
  const sep = ";";
  const head = ["Nr","Stufe","Frage","Antwort_gewaehlt","Richtige_Antwort","Korrekt","Zeit_Sekunden"];
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const rows = s.results.map((r,i) => [
    i+1, r.level, r.q, r.answer, r.correctAnswer,
    r.correct?"ja":"nein", r.timeSec.toFixed(2).replace(".",",")
  ].map(esc).join(sep));

  const right = s.results.filter(r=>r.correct).length;
  const totalTime = s.results.reduce((a,r)=>a+r.timeSec,0);
  const summary = [
    "", "",
    `Summe${sep}${esc("Richtig: "+right+" / "+s.results.length)}${sep}${esc("Gesamtzeit (s): "+totalTime.toFixed(2).replace(".",","))}`
  ];

  const csv = "\uFEFF" + [head.map(esc).join(sep), ...rows, ...summary].join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
  a.href = url; a.download = `quiz_ergebnis_${stamp}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function resetToStart(){
  $("results").classList.add("hidden");
  $("quiz").classList.add("hidden");
  $("start").classList.remove("hidden");
  $("progBar").style.width = "0%";
  updatePoolInfo();
}

/* ============================================================
   EVENTS
   ============================================================ */
$("startBtn").addEventListener("click", startQuiz);
$("nextBtn").addEventListener("click", next);
$("retryBtn").addEventListener("click", resetToStart);
$("csvBtn").addEventListener("click", downloadCSV);
</script>
</body>
</html>
